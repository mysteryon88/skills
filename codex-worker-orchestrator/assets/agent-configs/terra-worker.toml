# managed-by: codex-worker-orchestrator
name = "terra_worker"
description = "Ordinary bounded implementation, scoped UI/code fixes, and source-grounded technical writing."
model = "gpt-6.1-terra"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
