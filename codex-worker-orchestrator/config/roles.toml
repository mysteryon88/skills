[registry]
expected_names = [
  "repo_explorer", "docs_researcher", "runtime_investigator", "sol_architect",
  "skeptic", "luna_worker", "terra_worker", "sol_worker", "terra_analyst", "luna_test_runner",
  "sol_reviewer", "security_reviewer", "docs_writer", "astra_advisor",
]

[[roles]]
name = "repo_explorer"
filename = "repo-explorer.toml"
description = "Targeted repository, caller, data-flow, and configuration evidence."
model = "gpt-6.1-terra"
model_reasoning_effort = "low"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["explore-code"]
cost_rank = 1
fallbacks = []

[[roles]]
name = "docs_researcher"
filename = "docs-researcher.toml"
description = "Source-verified external library, API, and documentation research with citation-ready evidence."
model = "gpt-6.1-terra"
model_reasoning_effort = "low"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["research-docs"]
cost_rank = 1
fallbacks = []

[[roles]]
name = "runtime_investigator"
filename = "runtime-investigator.toml"
description = "Runtime reproduction and diagnostics without implementing fixes."
model = "gpt-6.2-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "diagnostic"
intents = ["reproduce-runtime"]
cost_rank = 2
fallbacks = ["repo_explorer"]

[[roles]]
name = "sol_architect"
filename = "sol-architect.toml"
description = "Ambiguous architecture, boundaries, tradeoffs, and executable plans."
model = "gpt-6.2-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["architecture", "visual-analysis"]
cost_rank = 4
fallbacks = []

[[roles]]
name = "skeptic"
filename = "skeptic.toml"
description = "Independent critique of substantive specifications, plans, assumptions, and claimed readiness."
model = "gpt-6.2-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["skeptic-review", "spec-review", "plan-gap-analysis", "plan-review"]
cost_rank = 2
fallbacks = []

[[roles]]
name = "luna_worker"
filename = "luna-worker.toml"
description = "Clear, bounded implementation and focused test authoring against fixed interfaces."
model = "gpt-6-luna"
model_reasoning_effort = "max"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "write"
intents = ["quick-implementation", "bounded-implementation", "deep-fixed-implementation", "test-authoring"]
cost_rank = 1
fallbacks = ["sol_worker"]

[[roles]]
name = "terra_worker"
filename = "terra-worker.toml"
description = "Source-grounded technical writing and revision for software projects."
model = "gpt-6.1-terra"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "write"
intents = ["content-writing"]
cost_rank = 2
fallbacks = ["sol_worker"]

[[roles]]
name = "sol_worker"
filename = "sol-worker.toml"
description = "Hard-profile coding, scoped UI fixes, connected multi-file changes, and integration debugging."
model = "gpt-6.2-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "write"
intents = ["quick-implementation", "bounded-implementation", "deep-fixed-implementation", "integration-debugging", "test-authoring", "content-writing"]
cost_rank = 3
fallbacks = []

[[roles]]
name = "terra_analyst"
filename = "terra-analyst.toml"
description = "Read-only visual evidence from application screenshots, UI states and rendered technical documents."
model = "gpt-6.1-terra"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["visual-analysis"]
cost_rank = 2
fallbacks = ["sol_architect"]

[[roles]]
name = "luna_test_runner"
filename = "luna-test-runner.toml"
description = "Execution-only builds and long, noisy, or independently useful checks; failures return to the root."
model = "gpt-6-luna"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "test-only"
intents = ["test-execution"]
cost_rank = 1
fallbacks = []

[[roles]]
name = "sol_reviewer"
filename = "sol-reviewer.toml"
description = "Mandatory independent review of every file-changing result and final integrated state."
model = "gpt-6.2-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["task-review", "final-review"]
cost_rank = 4
fallbacks = []

[[roles]]
name = "security_reviewer"
filename = "security-reviewer.toml"
description = "Evidence-backed trust-boundary and source-to-sink security review."
model = "gpt-6.2-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["security-review"]
cost_rank = 4
fallbacks = []

[[roles]]
name = "docs_writer"
filename = "docs-writer.toml"
description = "Documentation-only changes against established behavior."
model = "gpt-6-luna"
model_reasoning_effort = "max"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "workspace-write"
mutation_class = "documentation-only"
intents = ["documentation"]
cost_rank = 1
fallbacks = []

[[roles]]
name = "astra_advisor"
filename = "astra-advisor.toml"
description = "Last-resort read-only advice for extreme-complexity questions unresolved by Sol analysis."
model = "gpt-6.2-astra"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "concise"
model_verbosity = "low"
sandbox_mode = "read-only"
mutation_class = "read-only"
intents = ["deep-analysis"]
cost_rank = 5
fallbacks = []
